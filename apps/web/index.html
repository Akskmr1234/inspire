<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Aider ERP" />
    <!-- Paints the browser's own chrome to match the app rather than leaving a
         white bar above a dark interface on mobile. -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234338ca'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' font-family='system-ui, sans-serif' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3EAE%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Aider ERP</title>
    <script>
      /*
        Applies the stored theme and direction before the first paint.

        The application sets these from its session store, but that runs after React
        has mounted - which is one frame too late. Without this the browser paints a
        light interface and then repaints it dark, and the flash is at its worst
        exactly where it is most noticed: on a slow first load.

        Wrapped in a try/catch because localStorage throws rather than returning null
        when a browser is set to block site data, and a theme preference is not worth
        failing to boot over.
      */
      (function () {
        try {
          var theme = localStorage.getItem('erp.theme') || localStorage.getItem('erp.defaultTheme');

          if (!theme) {
            try {
              var s = JSON.parse(localStorage.getItem('erp.settings') || '{}');
              if (s.defaultTheme === 'light' || s.defaultTheme === 'dark') {
                theme = s.defaultTheme;
              }
            } catch (_) {}
          }

          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }

          var language = localStorage.getItem('erp.language') === 'ar' ? 'ar' : 'en';
          var root = document.documentElement;

          root.classList.toggle('dark', theme === 'dark');
          root.lang = language;
          root.dir = language === 'ar' ? 'rtl' : 'ltr';
        } catch (error) {
          /* No stored preference is reachable; the defaults in the markup stand. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
