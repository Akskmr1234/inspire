# privacyIDEA configuration, read from the environment on every start so the
# container itself keeps nothing that matters. The entrypoint validates the
# variables before privacyIDEA loads this file. Only UPPERCASE names are settings.
import os

_data = os.environ.get("PI_DATA", "/data")

SQLALCHEMY_DATABASE_URI = os.environ.get(
    "PI_DATABASE_URI", f"sqlite:///{_data}/privacyidea.sqlite"
)
# A managed PostgreSQL drops idle connections; check each one before use.
SQLALCHEMY_ENGINE_OPTIONS = {"pool_pre_ping": True}

SECRET_KEY = os.environ["PI_SECRET_KEY"]
PI_PEPPER = os.environ["PI_PEPPER"]

# Written by the entrypoint from PI_ENCKEY, or generated once on a volume.
PI_ENCFILE = f"{_data}/enckey"

PI_AUDIT_KEY_PRIVATE = f"{_data}/private.pem"
PI_AUDIT_KEY_PUBLIC = f"{_data}/public.pem"
# Without a volume the signing keys would change on every restart, so the audit
# log is kept unsigned rather than showing old entries as tampered with.
PI_AUDIT_NO_SIGN = os.environ.get("PI_AUDIT_NO_SIGN") == "1"

PI_LOGFILE = f"{_data}/privacyidea.log"
PI_LOGLEVEL = 20
SUPERUSER_REALM = ["administrator"]
